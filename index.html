<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panitikang Filipino — Complete Flashcard Reviewer (Linggo 1–7)</title>
  <style>
    :root{--bg:#031024;--card:#071827;--accent:#7dd3fc;--muted:rgba(255,255,255,0.08);--glass:rgba(255,255,255,0.03);font-family:Inter,system-ui,'Segoe UI',Roboto,Arial}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,#031024 0%,#071026 60%);color:#e6f2ff;display:flex;flex-direction:column;align-items:center;padding:28px}
    .app{width:100%;max-width:980px}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    h1{font-size:18px;margin:0}
    .controls{display:flex;gap:10px;align-items:center}
    select,button{appearance:none;border:0;padding:8px 12px;border-radius:10px;background:var(--glass);color:inherit}
    button.primary{background:var(--accent);color:#042028;font-weight:700}
    .card-wrap{perspective:1200px;display:flex;justify-content:center}
    .card{width:560px;max-width:94vw;height:260px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);box-shadow:0 16px 48px rgba(2,6,23,.65);position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.9,.3,1)}
    .card.flipped{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;padding:28px;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;justify-content:center}
    .front{background:linear-gradient(180deg,rgba(125,211,252,0.02),transparent);border:1px solid var(--muted);}
    .back{background:linear-gradient(180deg,#042831,#052a2f);transform:rotateY(180deg);border:1px solid rgba(125,211,252,0.06)}
    .definition{font-size:18px;line-height:1.4;text-align:center;font-weight:600}
    .term{font-size:26px;font-weight:800;text-transform:uppercase;text-align:center}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
    .nav{display:flex;gap:10px;justify-content:center;margin-top:16px}
    .small{font-size:13px;opacity:.9}
    footer{margin-top:18px;font-size:12px;opacity:.75;text-align:center}
    .controls .tiny{font-size:12px;opacity:.85}
    .progressBar{height:8px;background:rgba(255,255,255,0.04);border-radius:8px;overflow:hidden;width:220px}
    .progressFill{height:100%;background:linear-gradient(90deg,var(--accent),#60a5fa);width:0%}
    @media (max-width:560px){.card{height:220px;padding:12px}.definition{font-size:16px}.term{font-size:20px}}
    /* subtle flip shadow */
    .card::after{content:'';position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 60px rgba(0,0,0,0.18)}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Panitikang Filipino — Flashcards (Linggo 1–7)</h1>
        <div class="small">Definition = question (1–3 words). Click <strong>Flip</strong> to reveal the term. <span style="opacity:.85">(Modernismo style preserved)</span></div>
      </div>
      <div class="controls">
        <label class="tiny" for="week">Pumili ng Linggo</label>
        <select id="week"></select>
        <button id="shuffle" title="Shuffle this week's cards">Shuffle</button>
        <button id="shuffleAll" title="Shuffle all weeks combined">Shuffle All</button>
        <button id="resetViewed">Reset Viewed</button>
      </div>
    </header>

    <main>
      <div class="card-wrap">
        <div class="card" id="card">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>

      <div class="meta">
        <div id="progressText" class="small">Card 0 of 0 — Viewed 0/0</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="progressBar" aria-hidden>
            <div id="progressFill" class="progressFill"></div>
          </div>
          <div id="seenCount" class="small">Seen: 0</div>
        </div>
      </div>

      <div class="nav">
        <button id="prev">Previous</button>
        <button id="flip" class="primary">Flip</button>
        <button id="next">Next</button>
      </div>
    </main>

    <footer>Complete reviewer — all terms from Linggo 1–7 included. Use shuffle to randomize. Definitions fixed as requested.</footer>
  </div>

  <script>
    // dataset strictly follows the short-definition guide (1-3 words) — no changes to terms/definitions
    const dataset = {
      "Linggo 1": [
        {term:'PANITIKAN',def:'Sining ng pagpapahayag'},
        {term:'KASAYSAYAN',def:'Salamin ng lipunan'},
        {term:'WIKA',def:'Daluyan ng panitikan'},
        {term:'KULTURA',def:'Pamumuhay ng lipunan'},
        {term:'KAHALAGAHAN NG PANITIKAN',def:'Nagpapayaman ng wika'},
        {term:'PANITIKAN AT IDENTIDAD',def:'Pagkakakilanlan ng Pilipino'},
        {term:'PANITIKAN BILANG SANDATA',def:'Laban sa kolonyalismo'},
        {term:'PANITIKAN SA DIGITAL AGE',def:'Makabagong anyo'}
      ],
      "Linggo 2": [
        {term:'ANYONG PATULA',def:'May sukat at tugma'},
        {term:'ANYONG TULUYAN',def:'Tuwirang pahayag'},
        {term:'ANYONG DULA',def:'Itinatanghal'},
        {term:'PANITIKANG PASALITA',def:'Tradisyong oral'},
        {term:'PANITIKANG NASUSULAT',def:'Nakasulat/print'},
        {term:'SUKAT',def:'Bilang ng pantig'},
        {term:'TUGMA',def:'Magkakatulad na tunog'},
        {term:'TONO',def:'Damdamin ng awtor'}
      ],
      "Linggo 3": [
        {term:'PANAHON BAGO ESPANYOL',def:'Pasalitang tradisyon'},
        {term:'PANAHON NG ESPANYOL',def:'Panrelihiyon/kolonyal'},
        {term:'PANAHON NG AMERIKANO',def:'Edukasyon at modernisasyon'},
        {term:'PANAHON NG HAPON',def:'Pagyabong Tagalog'},
        {term:'PANAHON NG KASARINLAN',def:'Makabayang panitikan'},
        {term:'KLASISISMO',def:'Kaayusan at rasyonalitiy'}
      ],
      "Linggo 4": [
        {term:'NATURALISMO',def:'Heredity at kapaligiran'},
        {term:'IDEALISMO',def:'Kabutihan/moralidad'},
        {term:'SIMBOLISMO',def:'Sagisag/imahe'},
        {term:'REALISMO',def:'Katotohanan panlipunan'},
        {term:'IMPERYALISMO',def:'Kolonyal na impluwensya'},
        {term:'ROMANTISISMO',def:'Damdamin at imahinasyon'}
      ],
      "Linggo 5": [
        {term:'PSIKOLOHIKAL',def:'Motibo at damdamin'},
        {term:'SOSYOLOHIKAL',def:'Relasyon ng lipunan'},
        {term:'FEMINISMO',def:'Karapatan ng kababaihan'},
        {term:'EKSPRESYUNISMO',def:'Panloob na damdamin'},
        {term:'MODERNISMO',def:'Pagbabago/eksperimento'},
        {term:'EKSISTENSIYALISMO',def:'Pag-iral at kalayaan'}
      ],
      "Linggo 6": [
        {term:'PANLIPUNANG KAISIPAN',def:'Kondisyon ng lipunan'},
        {term:'PANGMORAL NA PANANAW',def:'Kabutihan at katarungan'},
        {term:'PANG-ANYO NA PANANAW',def:'Porma at estilo'},
        {term:'ARKITIPAL NA PANANAW',def:'Simbolo at huwaran'},
        {term:'EKONOMIKO AT PANLIPUNANG PAGAUNLAD',def:'Epekto ng values'}
      ],
      "Linggo 7": [
        {term:'ANIMISMO',def:'Espiritu ng kalikasan'},
        {term:'PATALISMO/BAHALA NA',def:'Pagtitiwala sa Diyos'},
        {term:'EUPHEMISMO',def:'Pag-iwas sa direkta'},
        {term:'PAKIKISAMA',def:'Pagkakaisa ng grupo'},
        {term:'UTANG NA LOOB',def:'Moral obligasyon'},
        {term:'NINGAS-KUGON',def:'Walang pagpapatuloy'},
        {term:'MAÑANA HABIT',def:'Pagpapaliban'},
        {term:'HOSPITALITY',def:'Pagkamapagpatuloy'}
      ]
    };

    // DOM refs
    const weekSelect = document.getElementById('week');
    const cardEl = document.getElementById('card');
    const front = document.getElementById('front');
    const back = document.getElementById('back');
    const flipBtn = document.getElementById('flip');
    const nextBtn = document.getElementById('next');
    const prevBtn = document.getElementById('prev');
    const shuffleBtn = document.getElementById('shuffle');
    const shuffleAllBtn = document.getElementById('shuffleAll');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');
    const seenCount = document.getElementById('seenCount');
    const resetViewed = document.getElementById('resetViewed');

    // setup weeks
    const weeks = Object.keys(dataset);
    weekSelect.innerHTML = '';
    weeks.forEach(w=>{ const opt = document.createElement('option'); opt.value = w; opt.textContent = w; weekSelect.appendChild(opt); });

    // state
    let currentWeek = weeks[0];
    let pool = [];
    let order = [];
    let idx = 0;
    const viewedSet = new Map(); // map week -> Set of ids

    function initWeek(week){
      currentWeek = week;
      pool = dataset[week].map((d,i)=>Object.assign({},d,{id:i}));
      order = shuffleArray(pool.slice());
      idx = 0;
      if(!viewedSet.has(week)) viewedSet.set(week,new Set());
      showCard(idx);
    }

    function shuffleArray(arr){
      for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
      return arr;
    }

    function showCard(i){
      const item = order[i];
      front.innerHTML = `<div class='definition'>${item.def}</div>`;
      back.innerHTML = `<div class='term'>${item.term}</div>`;
      cardEl.classList.remove('flipped');
      // mark viewed when shown (definition seen)
      viewedSet.get(currentWeek).add(item.id);
      updateProgress();
    }

    function updateProgress(){
      const total = order.length;
      const seen = viewedSet.get(currentWeek).size;
      progressText.textContent = `Card ${idx+1} of ${total} — Viewed ${seen}/${total}`;
      const pct = total? Math.round((seen/total)*100):0;
      progressFill.style.width = pct + '%';
      seenCount.textContent = `Seen: ${seen}`;
    }

    flipBtn.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));
    nextBtn.addEventListener('click', ()=>{ idx = (idx+1) % order.length; showCard(idx); });
    prevBtn.addEventListener('click', ()=>{ idx = (idx-1+order.length) % order.length; showCard(idx); });
    shuffleBtn.addEventListener('click', ()=>{ order = shuffleArray(pool.slice()); idx=0; showCard(idx); });
    shuffleAllBtn.addEventListener('click', ()=>{ // combine all weeks and shuffle into temp pool
      const all = weeks.flatMap(w=> dataset[w].map((d,i)=>Object.assign({},d,{week:w,id:i})) );
      order = shuffleArray(all.slice());
      // using synthetic currentWeek 'All'
      currentWeek = 'All (Shuffled)';
      if(!viewedSet.has(currentWeek)) viewedSet.set(currentWeek,new Set());
      // pool must match order items
      pool = order.slice();
      idx = 0;
      showCard(idx);
    });
    resetViewed.addEventListener('click', ()=>{ viewedSet.set(currentWeek,new Set()); updateProgress(); });

    weekSelect.addEventListener('change', e=> initWeek(e.target.value));

    document.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight') nextBtn.click();
      if(e.key==='ArrowLeft') prevBtn.click();
      if(e.key===' ') { e.preventDefault(); flipBtn.click(); }
    });

    // init
    initWeek(currentWeek);
  </script>
</body>
</html>
